name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Security problems must be reported privately (see SECURITY.md), not here.
        Never paste secrets, keys, tokens or real user data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Commands, requests or a failing test.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with anything sensitive removed.
      render: text
