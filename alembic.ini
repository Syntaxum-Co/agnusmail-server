# Alembic configuration. The database URL comes from AGNUSMAIL_DATABASE_URL (see
# src/agnusmail/migrations/env.py); it is never written here.
#
#   uv run alembic upgrade head

[alembic]
# The migrations ship inside the agnusmail package, so they work from a checkout and
# from an installed package alike.
script_location = agnusmail:migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
