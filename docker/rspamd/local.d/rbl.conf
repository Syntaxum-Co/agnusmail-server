# Lists that look inside the body (links, quoted e-mail addresses) are off: they would
# send content-derived domains/addresses to third parties before encryption.
rules {
  SURBL_MULTI { enabled = false; }
  SURBL_HASHBL { enabled = false; }
  URIBL_MULTI { enabled = false; }
  RSPAMD_URIBL { enabled = false; }
  DBL { enabled = false; }
  SEM_URIBL_UNKNOWN { enabled = false; }
  SEM_URIBL_FRESH15_UNKNOWN { enabled = false; }
  RSPAMD_EMAILBL { enabled = false; }
  MSBL_EBL { enabled = false; }
  SPAMHAUS_ZEN_URIBL { enabled = false; }
}
